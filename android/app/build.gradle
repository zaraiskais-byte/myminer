plugins { id 'com.android.application' }

android {
    namespace 'com.caesarczr.wallet'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "../keystore/caesar-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "caesar123"
            keyAlias System.getenv("KEY_ALIAS") ?: "caesar"
            keyPassword System.getenv("KEY_PASSWORD") ?: "caesar123"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    defaultConfig {
        applicationId "com.caesarczr.wallet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
