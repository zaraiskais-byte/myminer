plugins { id 'com.android.application' }

// Release signing: no defaults, no fallbacks. If any required
// variable is missing the build fails immediately, so an unsigned
// or hardcoded-key release cannot be produced by accident.
def requireEnv = { String name ->
    def v = System.getenv(name)
    if (v == null || v.isEmpty()) {
        throw new GradleException(
            "Missing required environment variable: ${name}")
    }
    return v
}

android {
    namespace 'com.caesarczr.wallet'
    compileSdk 34

    signingConfigs {
        release {
            storeFile     file(requireEnv("KEYSTORE_PATH"))
            storePassword requireEnv("KEYSTORE_PASSWORD")
            keyAlias      requireEnv("KEY_ALIAS")
            keyPassword   requireEnv("KEY_PASSWORD")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    defaultConfig {
        applicationId "com.caesarczr.wallet"
        minSdk 26
        targetSdk 34
        versionCode(Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1"))
        versionName("3.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0"))
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
