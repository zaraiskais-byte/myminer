name: Caesar Core Verification

on:
  push:
    branches: [ "app-open-termux-wallet" ]
  pull_request:
    branches: [ "app-open-termux-wallet" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install C++ Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make

    - name: Build C++ Core Engine
      run: |
        echo "[*] Building C++ Core Engine for Ubuntu (x86_64)..."
        cmake -B build .
        cmake --build build -j
        echo "[+] Build complete. Binaries are in the build/ directory."

    - name: Run Core Verification
      run: |
        echo "======================================================="
        echo "  CAESAR CZR - CORE VERIFICATION PIPELINE"
        echo "  Architect/Owner: Zaraiskais-byte"
        echo "======================================================="
        python3 czr_sentinel.py
        python3 czr_wallet_bridge.py
        echo "[+] Core verification passed successfully!"
