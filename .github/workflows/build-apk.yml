name: Build APK (Self-Healing)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Get OpenSSL
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            rm -rf /tmp/android_openssl
            git clone --depth 1 https://github.com/KDAB/android_openssl.git /tmp/android_openssl
      - name: Detect OpenSSL
        run: |
          if [ -d /tmp/android_openssl/ssl_3 ]; then echo "OPENSSL_BASE=/tmp/android_openssl/ssl_3" >> $GITHUB_ENV
          elif [ -d /tmp/android_openssl/openssl-3 ]; then echo "OPENSSL_BASE=/tmp/android_openssl/openssl-3" >> $GITHUB_ENV
          elif [ -d /tmp/android_openssl/openssl-1.1.1 ]; then echo "OPENSSL_BASE=/tmp/android_openssl/openssl-1.1.1" >> $GITHUB_ENV
          else DIR=$(ls -d /tmp/android_openssl/*/ 2>/dev/null | head -1); echo "OPENSSL_BASE=${DIR%/}" >> $GITHUB_ENV; fi
          ls "$OPENSSL_BASE/arm64-v8a" 2>/dev/null | head -5
      - name: Compile native
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd android/app/src/main/cpp
            rm -rf build && mkdir -p build
            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DOPENSSL_ROOT=$OPENSSL_BASE/arm64-v8a \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target caesar_web -j4
            cp build/caesar_web ../../assets/caesar_web
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            cd android
            rm -rf build app/build
            gradle assembleDebug --no-daemon
      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
  self-heal:
    needs: build
    if: failure()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run smart fix
        run: |
          bash scripts/smart_diagnose.sh
          bash scripts/smart_fix.sh
      - name: Commit fixes
        run: |
          git config user.name "caesar-healer[bot]"
          git config user.email "healer@caesar-czr.local"
          git add -A
          git commit -m "smart-fix: auto-repair build issues [skip ci]" || true
          git push || true
      - name: Retry workflow
        if: github.run_attempt < 5
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
