name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Prepare OpenSSL structure (compatible with CMakeLists)
        run: |
          set -e
          cd /tmp
          git clone --depth 1 https://github.com/KDAB/android_openssl.git
          
          # Create expected structure: $OPENSSL_ROOT/include + $OPENSSL_ROOT/lib
          mkdir -p /tmp/openssl-android
          cp -r /tmp/android_openssl/ssl_3/include /tmp/openssl-android/include
          mkdir -p /tmp/openssl-android/lib
          cp /tmp/android_openssl/ssl_3/arm64-v8a/*.a /tmp/openssl-android/lib/
          
          echo "=== VERIFY ==="
          ls -la /tmp/openssl-android/
          echo "--- include/openssl ---"
          ls /tmp/openssl-android/include/openssl/rand.h && echo "RAND.H FOUND ✅"
          echo "--- lib ---"
          ls -la /tmp/openssl-android/lib/

      - name: Compile native caesar_web
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build && mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=/tmp/openssl-android \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          cp build/caesar_web ../../assets/caesar_web
          ls -la ../../assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          cd android
          rm -rf build app/build
          gradle assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
