name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build OpenSSL for Android
        run: |
          set -e
          cd /tmp
          wget -q https://www.openssl.org/source/openssl-3.0.13.tar.gz
          tar xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13

          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=aarch64-linux-android26-clang
          export CXX=aarch64-linux-android26-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          # Fix: remove world-writable dirs from PATH
          CLEAN_PATH=""
          IFS=':' read -ra DIRS <<< "$PATH"
          for d in "${DIRS[@]}"; do
            if [ -d "$d" ]; then
              perms=$(stat -c '%a' "$d" 2>/dev/null || echo "755")
              last=${perms: -1}
              if [[ "$last" == "2" ]] || [[ "$last" == "3" ]] || [[ "$last" == "6" ]] || [[ "$last" == "7" ]]; then
                echo "Skipping world-writable: $d"
                continue
              fi
            fi
            if [ -z "$CLEAN_PATH" ]; then CLEAN_PATH="$d"; else CLEAN_PATH="$CLEAN_PATH:$d"; fi
          done
          export PATH="$CLEAN_PATH"

          ./Configure android-arm64 \
            -D__ANDROID_API__=26 \
            no-shared no-tests no-apps no-docs \
            --prefix=/tmp/openssl-android

          make -j4
          make install_sw

          echo "OPENSSL_BASE=/tmp/openssl-android" >> $GITHUB_ENV
          ls -la /tmp/openssl-android/lib/ | head

      - name: Compile native
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build && mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=$OPENSSL_BASE \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          cp build/caesar_web ../../assets/caesar_web
          ls -la ../../assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          cd android
          rm -rf build app/build
          gradle assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
