name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Get prebuilt OpenSSL for Android
        run: |
          set -e
          cd /tmp
          git clone --depth 1 https://github.com/KDAB/android_openssl.git
          cd android_openssl
          echo "==========================================="
          echo " FULL REPOSITORY STRUCTURE"
          echo "==========================================="
          find . -type d | head -50
          echo
          echo "==========================================="
          echo " SEARCH FOR libcrypto"
          echo "==========================================="
          find . -name "libcrypto*" -o -name "libssl*" | head -30
          echo
          echo "==========================================="
          echo " ARM64-v8a FOLDERS"
          echo "==========================================="
          find . -type d -name "arm64-v8a" | head -20

      - name: Auto-detect OpenSSL paths
        run: |
          set -e
          cd /tmp/android_openssl
          # Find any directory containing openssl/rand.h
          echo "Looking for include/openssl/rand.h..."
          H_FILE=$(find . -name "rand.h" -path "*/openssl/*" | head -1)
          echo "Found rand.h at: $H_FILE"
          if [ -z "$H_FILE" ]; then
            echo "ERROR: openssl/rand.h not found"
            exit 1
          fi
          INCLUDE_DIR=$(dirname $(dirname "$H_FILE"))
          echo "INCLUDE_DIR=$INCLUDE_DIR"
          echo "OPENSSL_INCLUDE_DIR=$INCLUDE_DIR" >> $GITHUB_ENV

          # Find libcrypto.a for arm64
          echo "Looking for libcrypto.a..."
          CRYPTO_A=$(find . -name "libcrypto.a" -path "*arm64-v8a*" | head -1)
          echo "Found libcrypto.a at: $CRYPTO_A"
          if [ -n "$CRYPTO_A" ]; then
            LIB_DIR=$(dirname "$CRYPTO_A")
            echo "LIB_DIR=$LIB_DIR"
            echo "OPENSSL_LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
            echo "OPENSSL_CRYPTO_A=$CRYPTO_A" >> $GITHUB_ENV
          else
            echo "No static lib found - checking for shared .so"
            CRYPTO_SO=$(find . -name "libcrypto.so*" -path "*arm64-v8a*" | head -1)
            echo "Found libcrypto.so at: $CRYPTO_SO"
            if [ -n "$CRYPTO_SO" ]; then
              LIB_DIR=$(dirname "$CRYPTO_SO")
              echo "OPENSSL_LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
            fi
          fi

      - name: Verify everything
        run: |
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_LIB_DIR=$OPENSSL_LIB_DIR"
          echo "OPENSSL_CRYPTO_A=$OPENSSL_CRYPTO_A"
          echo
          echo "=== include/openssl ==="
          ls -la "$OPENSSL_INCLUDE_DIR/openssl/" | head -10
          echo
          echo "=== lib folder ==="
          ls -la "$OPENSSL_LIB_DIR/" | head -20

      - name: Compile native caesar_web
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build && mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT_DIR="$OPENSSL_LIB_DIR/.." \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_INCLUDE_DIR" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          cp build/caesar_web ../../assets/caesar_web
          ls -la ../../assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          cd android
          rm -rf build app/build
          gradle assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
