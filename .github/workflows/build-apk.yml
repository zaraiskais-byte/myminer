name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;25.2.9519653" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Prepare OpenSSL
        run: |
          set -e
          git clone --depth 1 https://github.com/KDAB/android_openssl /tmp/android_openssl
          mkdir -p /tmp/openssl-android/include
          mkdir -p /tmp/openssl-android/lib
          cp -r /tmp/android_openssl/ssl_3/include/* /tmp/openssl-android/include/
          cp /tmp/android_openssl/ssl_3/arm64-v8a/libcrypto.a /tmp/openssl-android/lib/libcrypto.a
          cp /tmp/android_openssl/ssl_3/arm64-v8a/libssl.a /tmp/openssl-android/lib/libssl.a
          ls -la /tmp/openssl-android/include
          ls -la /tmp/openssl-android/lib

      - name: Compile native caesar_web
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=/tmp/openssl-android \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          mkdir -p ../../assets
          cp build/caesar_web ../../assets/caesar_web
          chmod +x ../../assets/caesar_web
          ls -la ../../assets/
          file build/caesar_web

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-build-cache --no-daemon

      - name: Verify caesar_web inside APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK path: $APK"
          unzip -l "$APK" | grep -i caesar_web || (echo "ERROR: caesar_web missing from APK" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
