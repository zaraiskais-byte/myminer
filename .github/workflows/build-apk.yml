name: Build APK
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle
        run: |
          set -e
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Prepare OpenSSL
        run: |
          set -e
          git clone --depth 1 --branch master https://github.com/KDAB/android_openssl /tmp/android_openssl
          mkdir -p /tmp/openssl-android/include /tmp/openssl-android/lib
          cp -r /tmp/android_openssl/ssl_3/include/* /tmp/openssl-android/include/
          cp /tmp/android_openssl/ssl_3/arm64-v8a/libcrypto.a /tmp/openssl-android/lib/libcrypto.a
          cp /tmp/android_openssl/ssl_3/arm64-v8a/libssl.a /tmp/openssl-android/lib/libssl.a
          ls -la /tmp/openssl-android/lib/

      - name: Compile native caesar_web
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build && mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=/tmp/openssl-android \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          mkdir -p ../jniLibs/arm64-v8a
          cp build/caesar_web ../jniLibs/arm64-v8a/libcaesar_web.so
          chmod +x ../jniLibs/arm64-v8a/libcaesar_web.so
          file ../jniLibs/arm64-v8a/libcaesar_web.so

      - name: Restore or create release keystore
        run: |
          set -e
          mkdir -p android/keystore
          if [ ! -f android/keystore/caesar-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/caesar-release.keystore \
              -alias caesar -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass caesar123 -keypass caesar123 \
              -dname "CN=Caesar CZR, OU=Wallet, O=Caesar, L=Tripoli, C=LY"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore/caesar-release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=caesar123" >> $GITHUB_ENV
          echo "KEY_ALIAS=caesar" >> $GITHUB_ENV
          echo "KEY_PASSWORD=caesar123" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          set -e
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle clean assembleRelease --no-daemon --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Caesar CZR v3.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
