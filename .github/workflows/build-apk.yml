name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Get prebuilt OpenSSL for Android
        run: |
          set -e
          cd /tmp
          # Download prebuilt OpenSSL from KDAB repo (stable, tested)
          git clone --depth 1 https://github.com/KDAB/android_openssl.git
          cd android_openssl
          echo "=== Available directories ==="
          ls -la
          echo "=== Looking for arm64 libs ==="
          find . -name "libcrypto*" | head -20
          # Try all possible paths
          if [ -d "ssl_3/arm64-v8a" ]; then
            echo "OPENSSL_BASE=/tmp/android_openssl/ssl_3" >> $GITHUB_ENV
            echo "FOUND ssl_3/arm64-v8a"
          elif [ -d "openssl-3/arm64-v8a" ]; then
            echo "OPENSSL_BASE=/tmp/android_openssl/openssl-3" >> $GITHUB_ENV
            echo "FOUND openssl-3/arm64-v8a"
          elif [ -d "ssl_1.1.1/arm64-v8a" ]; then
            echo "OPENSSL_BASE=/tmp/android_openssl/ssl_1.1.1" >> $GITHUB_ENV
            echo "FOUND ssl_1.1.1/arm64-v8a"
          else
            echo "ERROR: No arm64-v8a found"
            find . -maxdepth 3 -type d | head -20
            exit 1
          fi

      - name: Verify OpenSSL files
        run: |
          echo "OPENSSL_BASE=$OPENSSL_BASE"
          ls -la "$OPENSSL_BASE/arm64-v8a/" || true
          ls -la "$OPENSSL_BASE/arm64-v8a/lib/" 2>/dev/null || ls -la "$OPENSSL_BASE/arm64-v8a/" | head -20

      - name: Compile native caesar_web
        run: |
          set -e
          cd android/app/src/main/cpp
          rm -rf build && mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=$OPENSSL_BASE/arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          cp build/caesar_web ../../assets/caesar_web
          ls -la ../../assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          cd android
          rm -rf build app/build
          gradle assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
