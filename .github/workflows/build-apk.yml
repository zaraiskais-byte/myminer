name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Get OpenSSL
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/KDAB/android_openssl.git
          ls /tmp/android_openssl/
      - name: Detect OpenSSL
        run: |
          if [ -d /tmp/android_openssl/ssl_3 ]; then
            echo "OPENSSL_BASE=/tmp/android_openssl/ssl_3" >> $GITHUB_ENV
          else
            echo "OPENSSL_BASE=/tmp/android_openssl/openssl-3" >> $GITHUB_ENV
          fi
      - name: Compile native
        run: |
          cd android/app/src/main/cpp
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DOPENSSL_ROOT=$OPENSSL_BASE/arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target caesar_web -j4
          cp build/caesar_web ../../assets/caesar_web
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Caesar CZR v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
