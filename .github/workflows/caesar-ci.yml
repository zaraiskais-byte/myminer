name: Caesar CZR CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-sanitize-fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libssl-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
          cmake --build build -j2

      - name: Unit and regression tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Sanitizer build
        run: |
          cmake -S . -B sanitizer-build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCAESAR_ENABLE_SANITIZERS=ON
          cmake --build sanitizer-build -j2

      - name: Sanitizer tests
        run: |
          ctest --test-dir sanitizer-build --output-on-failure

      - name: Build fuzzers
        run: |
          mkdir -p fuzz-build

          clang++ -std=c++20 \
            -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -Iinclude \
            fuzz/transaction_fuzzer.cpp \
            -lcrypto \
            -o fuzz-build/transaction-fuzzer

          clang++ -std=c++20 \
            -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -Iinclude \
            fuzz/block_fuzzer.cpp \
            -lcrypto \
            -o fuzz-build/block-fuzzer

          clang++ -std=c++20 \
            -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -Iinclude \
            fuzz/crypto_fuzzer.cpp \
            -lcrypto \
            -o fuzz-build/crypto-fuzzer

      - name: Transaction fuzzing
        run: |
          ./fuzz-build/transaction-fuzzer \
            -runs=10000 \
            -max_len=4096

      - name: Block fuzzing
        run: |
          ./fuzz-build/block-fuzzer \
            -runs=10000 \
            -max_len=16384

      - name: Crypto and Merkle fuzzing
        run: |
          ./fuzz-build/crypto-fuzzer \
            -runs=10000 \
            -max_len=4096

  # -------------------------------------------------------------------------
  # ThreadSanitizer job.
  #
  # Complements the existing build-test-sanitize-fuzz job:
  #   - ASan + UBSan there catch memory errors and UB.
  #   - TSan here catches data races and lock misuse.
  #
  # We only build and run the tests that exercise concurrency directly,
  # so the extra CI time stays bounded. The full test suite still runs in
  # the main job above under ASan/UBSan.
  # -------------------------------------------------------------------------
  tsan-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libssl-dev

      - name: Build with ThreadSanitizer
        run: |
          cmake -S . -B tsan-build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCAESAR_ENABLE_TSAN=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build tsan-build -j2 \
            --target caesar_p2p_lifecycle_race_test \
                     caesar_node_test \
                     caesar_two_node_p2p_test

      - name: TSan concurrency tests
        env:
          # Fail fast on the first reported race so the log is readable.
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: |
          ctest --test-dir tsan-build \
            -R 'CaesarP2PLifecycleRaceTest|CaesarNodeTest|CaesarTwoNodeP2PTest' \
            --output-on-failure
